# Copy this file to the root of your backend GitHub repository as buildspec.yml

version: 0.2

phases:
  install:
    runtime-versions:
      python: 3.12
      nodejs: 20

  pre_build:
    commands:
      - echo "=== DEV auto-deploy | backend=$SOURCE_BRANCH frontend=$FRONTEND_BRANCH ==="
      - pip install --upgrade pip
      - pip install -r requirements.txt boto3
      - python scripts/sync_eb_env.py

  build:
    commands:
      - echo "Building frontend from $FRONTEND_REPO ($FRONTEND_BRANCH)"
      - |
        if [ -n "$GITHUB_TOKEN" ]; then
          FRONTEND_GIT_URL="https://x-access-token:${GITHUB_TOKEN}@github.com/${FRONTEND_REPO}.git"
        else
          FRONTEND_GIT_URL="https://github.com/${FRONTEND_REPO}.git"
        fi
        git clone --depth 1 --branch "$FRONTEND_BRANCH" "$FRONTEND_GIT_URL" frontend-src
      - cd frontend-src
      - npm ci
      - export VITE_API_URL=""
      - npm run build
      - cd ..
      - rm -rf static/frontend
      - mkdir -p static/frontend
      - cp -R frontend-src/dist/* static/frontend/
      - echo "Frontend bundle copied to static/frontend"

  post_build:
    commands:
      - echo "Build completed at $(date -u +%Y-%m-%dT%H:%M:%SZ)"

artifacts:
  files:
    - "**/*"
  base-directory: .

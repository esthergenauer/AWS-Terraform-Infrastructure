# Copy this file to the root of your backend GitHub repository as buildspec.yml
# Staging pipeline reads this from sbl-infrastructure/examples/buildspec.yml

version: 0.2

phases:
  install:
    runtime-versions:
      python: 3.12

  pre_build:
    commands:
      - echo "=== Docker deploy | backend=$SOURCE_BRANCH frontend=$FRONTEND_BRANCH ==="
      - pip install --upgrade pip
      - pip install boto3
      - python scripts/sync_eb_env.py

  build:
    commands:
      - echo "Preparing Docker build context for Elastic Beanstalk"
      - |
        if [ -n "$GITHUB_TOKEN" ]; then
          FRONTEND_GIT_URL="https://x-access-token:${GITHUB_TOKEN}@github.com/${FRONTEND_REPO}.git"
        else
          FRONTEND_GIT_URL="https://github.com/${FRONTEND_REPO}.git"
        fi
        rm -rf frontend-src
        git clone --depth 1 --branch "$FRONTEND_BRANCH" "$FRONTEND_GIT_URL" frontend-src
      - rm -rf frontend-src/node_modules frontend-src/dist
      - test -f Dockerfile
      - echo "=== DevSecOps security gate (Trivy + TruffleHog) ==="
      - chmod +x scripts/run_security_scan.sh
      - bash scripts/run_security_scan.sh .
      - echo "Dockerfile + backend + frontend-src ready for EB Docker platform"

  post_build:
    commands:
      - echo "Build completed at $(date -u +%Y-%m-%dT%H:%M:%SZ)"
      - echo "Artifact contains Dockerfile — EB builds the container image on deploy"

artifacts:
  files:
    - "**/*"
  exclude-paths:
    - frontend-src/node_modules/**/*
    - frontend-src/dist/**/*
    - .git/**/*
    - "**/__pycache__/**/*"
    - "**/*.pyc"
